<script>

function parseNum(v) {
  if (v === '' || v === null || v === undefined) return null;
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v).replace(/\./g, '').replace(',', '.'));
  return isNaN(n) ? null : n;
}

function fmtPrecio(v) {
  const n = parseNum(v);
  return n === null ? '—' : new Intl.NumberFormat('es-CL').format(Math.round(n));
}

function fmtScore(v) {
  const n = parseNum(v);
  return n === null ? '—' : Math.round(n);
}

// Color de referencia por nivel de confianza — usado en la barra de gauge.
function colorConfianza(score) {
  if (score === null) return '#5A4F3E';
  if (score >= 80) return '#8FBB78';
  if (score >= 50) return '#E0B15C';
  return '#E38E71';
}

// El borde izquierdo de la tarjeta funciona como código de color de muestra:
// se ve de reojo sin necesidad de leer texto. Usa el feedback ya proyectado
// por el motor (item.repetiria), no una consulta aparte.
function stripeClass(c) {
  const tieneFeedback = (c.feedbackUsuario && c.feedbackUsuario.length > 0);
  if (!tieneFeedback) return 'border-l-line';
  if (c.repetiria === true) return 'border-l-moss';
  if (c.repetiria === false && c.descartado) return 'border-l-declinado';
  return 'border-l-inkmuted';
}

// Badge de feedback: usa directamente lo que Vista_Compra_Maestra ya
// proyecta (descartado / repetiria / feedbackUsuario), sin cruzar por URL.
function feedbackBadgeHtml(c) {
  if (!c.feedbackUsuario || c.feedbackUsuario.length === 0) return '';
  // Toma la entrada más reciente por fecha si hay varias.
  const ultima = c.feedbackUsuario.slice().sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')))[0];

  let texto, estilo;
  if (c.descartado) {
    texto = 'Descartado'; estilo = 'bg-paper text-declinado';
  } else if (c.repetiria === true) {
    texto = 'Repetiría: Sí'; estilo = 'bg-mossbg text-moss';
  } else if (c.repetiria === false) {
    texto = 'Repetiría: No'; estilo = 'bg-paper text-declinado';
  } else {
    texto = 'Con feedback'; estilo = 'bg-paper text-inkmuted';
  }
  if (ultima && ultima.comentario) texto += ` · "${ultima.comentario}"`;

  return `<span class="inline-block text-sm font-medium px-2.5 py-1 rounded ${estilo}">✓ ${texto}</span>`;
}

// Badge de disponibilidad: campo booleano directo del motor, sin normalización propia.
function disponibleBadgeHtml(disponible) {
  return disponible
    ? `<span class="inline-block text-sm font-medium px-2.5 py-1 rounded bg-mossbg text-moss">Disponible</span>`
    : `<span class="inline-block text-sm font-medium px-2.5 py-1 rounded bg-claybg text-clay">Agotado</span>`;
}

// Alerta de precio: viene embebida en la propia fila (Mejor_Alerta_Display_Group),
// no se cruza con una hoja aparte. Se muestra tal cual la entrega el motor.
function alertaInfoHtml(mejorAlerta) {
  if (!mejorAlerta) return '';
  const tipo = String(mejorAlerta.tipo || '').toUpperCase();

  let icon, colorClass;
  if (tipo.includes('SOSPECH')) {
    icon = '⚠️'; colorClass = 'bg-claybg text-clay';
  } else if (tipo.includes('MINIMO')) {
    icon = '💰'; colorClass = 'bg-ochrebg text-ochre';
  } else if (tipo.includes('STOCK')) {
    icon = '📦'; colorClass = 'bg-mossbg text-moss';
  } else if (tipo.includes('BAJA') || tipo.includes('PRECIO')) {
    icon = '🔥'; colorClass = 'bg-claybg text-clay';
  } else {
    // Tipo no reconocido — se muestra igual, sin ocultar en silencio.
    icon = '🔔'; colorClass = 'bg-ochrebg text-ochre';
  }

  const anterior = parseNum(mejorAlerta.precio_anterior);
  const actual = parseNum(mejorAlerta.precio_actual);
  let detalle = tipo.replace(/_/g, ' ');
  if (anterior !== null && actual !== null) {
    detalle += ` · antes $${fmtPrecio(anterior)} → ahora $${fmtPrecio(actual)}`;
  }

  const badge = `<span class="inline-block text-sm font-medium px-2.5 py-1 rounded ${colorClass}">${icon} ${detalle}</span>`;
  return badge;
}

// El contrato V3 espera Altura como msnm real. Un valor fuera de rango
// (ej. "1") casi seguro es un bug de conversión en el motor, no una altura
// real — no se corrige acá, solo se evita mostrarlo como si fuera válido.
function formatAltitude(value) {
  const altitude = Number(String(value).replace(',', '.'));
  if (!Number.isFinite(altitude) || altitude < 100 || altitude > 4000) {
    if (value !== '' && value !== null && value !== undefined) {
      console.warn('Altura fuera de rango contractual:', value);
    }
    return '';
  }
  return `${Math.round(altitude).toLocaleString('es-CL')} msnm`;
}

function tiendaInfoHtml(nombreTienda) {
  const t = tiendasPorNombre[String(nombreTienda || '').trim()];
  if (!t) return '';

  if (t.tipoTienda && t.tipoTienda.toLowerCase() === 'virtual') {
    return `<p class="text-inkmuted">🌐 Solo venta online</p>`;
  }

  const partes = [t.direccion, t.comuna].filter(Boolean).join(', ');
  if (!partes && !t.notasUbicacion) return '';

  return `<p class="text-inkmuted">📍 ${partes}${t.notasUbicacion ? ' (' + t.notasUbicacion + ')' : ''}</p>`;
}

function formatosHtml(c) {
  const disp = Array.isArray(c.formatosDisponibles) ? c.formatosDisponibles : [];
  const agot = Array.isArray(c.formatosAgotados) ? c.formatosAgotados : [];
  if (disp.length === 0 && agot.length === 0) return '';

  const partes = disp.map(g => `${g} g`);
  const agotTxt = agot.length ? ` (agotado: ${agot.map(g => g + ' g').join(', ')})` : '';
  return `<p class="text-sm text-inkmuted mt-1">Disponible en: ${partes.join(' · ')}${agotTxt}</p>`;
}

function cardHtml(c, i) {
  const meta = [c.tienda, c.origen, c.proceso, c.variedad].filter(Boolean).join(' · ');
  const numRanking = c.rankingAfinidad !== undefined && c.rankingAfinidad !== null && c.rankingAfinidad !== ''
    ? String(c.rankingAfinidad) : '—';
  const scoreConf = parseNum(c.confianzaEstimacion);
  const pctConf = scoreConf === null ? 0 : Math.max(0, Math.min(100, scoreConf));

  return `
  <div class="relative overflow-hidden bg-surface border border-line ${stripeClass(c)} border-l-4 rounded-2xl p-4">
    <span class="absolute -top-4 -right-1 font-display font-bold text-[84px] leading-none text-ink opacity-[0.05] pointer-events-none select-none">${numRanking}</span>

    ${alertaInfoHtml(c.mejorAlerta) ? `<div class="relative z-10 mb-2.5">${alertaInfoHtml(c.mejorAlerta)}</div>` : ''}

    <div class="relative z-10 flex items-start gap-3">
      <div class="w-8 h-8 rounded-full bg-paper border border-line flex items-center justify-center text-sm font-mono text-espresso shrink-0">${numRanking}</div>
      <div class="flex-1 min-w-0">
        <p class="font-display font-semibold text-[19px] leading-snug text-ink">${c.cafe || 'Sin nombre'}</p>
        <p class="text-sm text-inkmuted mt-0.5">${meta}</p>
        <span id="feedback-badge-${i}">${feedbackBadgeHtml(c)}</span>
      </div>
    </div>

    ${c.notas ? `<p class="text-base text-inkmuted italic mt-2 font-display">☕ ${c.notas}</p>` : ''}

    <div class="relative z-10 flex items-center gap-2 mt-2.5 flex-wrap">
      ${disponibleBadgeHtml(c.disponible)}
      ${formatAltitude(c.altura) ? `<span class="text-sm font-mono text-inkmuted uppercase tracking-wide">${formatAltitude(c.altura)}</span>` : ''}
      ${c.productorFinca ? `<span class="text-sm font-mono text-inkmuted uppercase tracking-wide">${c.productorFinca}</span>` : ''}
    </div>
    ${formatosHtml(c)}

    <div class="relative z-10 h-px bg-line my-3"></div>

    <div class="relative z-10 flex items-center justify-between">
      <div class="flex items-baseline gap-1">
        <span class="font-display font-bold text-2xl text-ink">$${fmtPrecio(c.precioKgMostrado)}</span>
        <span class="text-sm text-inkmuted">/kg${c.pesoPrincipalG ? ` · ${c.pesoPrincipalG} g` : ''}</span>
      </div>
      <div class="flex items-center gap-2.5">
        <div class="flex flex-col items-end gap-1">
          <span class="text-[11px] font-mono text-inkmuted tracking-wide">CONF ${fmtScore(c.confianzaEstimacion)}</span>
          <div class="w-16 h-[5px] rounded-full bg-line overflow-hidden">
            <div class="h-full rounded-full" style="width:${pctConf}%; background:${colorConfianza(scoreConf)}"></div>
          </div>
        </div>
        ${c.urlCompra ? `<a href="${c.urlCompra}" target="_blank" rel="noopener" class="w-[34px] h-[34px] flex items-center justify-center rounded-lg bg-paper border border-line text-ink">↗</a>` : ''}
        <button onclick="toggleDetail(${i})" class="w-[34px] h-[34px] flex items-center justify-center rounded-lg bg-paper border border-line text-ink">⌄</button>
      </div>
    </div>

    <div id="detail-${i}" class="relative z-10 hidden mt-3 pt-3 border-t border-line text-sm text-inkmuted space-y-1.5">
      <p class="text-[11px] font-mono text-inkmuted">AFINIDAD ${fmtScore(c.afinidadPersonal)} · CONVENIENCIA ${fmtScore(c.convenienciaCompra)}</p>
      ${tiendaInfoHtml(c.tienda)}

      <div class="pt-3 mt-2 border-t border-line">
        <p class="text-sm font-semibold text-ink mb-2 font-display tracking-wide">Tu experiencia</p>

        <div class="grid grid-cols-2 gap-2">
          <select id="fb-estado-${i}" class="text-sm border border-line rounded-md px-2.5 py-2 bg-paper text-ink">
            <option value="">Estado compra</option>
            <option>Comprado</option>
            <option>Probado</option>
            <option>No comprado</option>
            <option>Descartado</option>
          </select>
          <select id="fb-repetiria-${i}" class="text-sm border border-line rounded-md px-2.5 py-2 bg-paper text-ink">
            <option value="">Repetiría</option>
            <option>Sí</option>
            <option>No</option>
            <option>Tal vez</option>
          </select>
        </div>

        <textarea id="fb-comentario-${i}" placeholder="Comentario (opcional)" class="w-full text-sm border border-line rounded-md px-2.5 py-2 mt-2 bg-paper text-ink" rows="2"></textarea>

        <details class="mt-2">
          <summary class="text-sm text-inkmuted cursor-pointer select-none">Más detalle (percepción sensorial, opcional)</summary>
          <div class="grid grid-cols-2 gap-2 mt-2">
            <input id="fb-rating-${i}" type="number" min="1" max="10" placeholder="Rating 1-10" class="text-sm border border-line rounded-md px-2.5 py-2 bg-paper text-ink">
            ${['Acidez', 'Dulzor', 'Cuerpo', 'Amargor'].map(campo => `
              <select id="fb-${campo.toLowerCase()}-${i}" class="text-sm border border-line rounded-md px-2.5 py-2 bg-paper text-ink">
                <option value="">${campo} percibid${campo === 'Acidez' ? 'a' : 'o'}</option>
                <option>Baja</option><option>Media-baja</option><option>Media</option><option>Media-alta</option><option>Alta</option>
              </select>`).join('')}
            <input id="fb-tostado-${i}" type="text" placeholder="Tostado percibido" class="text-sm border border-line rounded-md px-2.5 py-2 bg-paper text-ink">
            <input id="fb-espresso-${i}" type="text" placeholder="Resultado espresso" class="text-sm border border-line rounded-md px-2.5 py-2 bg-paper text-ink">
            <input id="fb-leche-${i}" type="text" placeholder="Resultado con leche" class="text-sm border border-line rounded-md px-2.5 py-2 bg-paper text-ink col-span-2">
          </div>
        </details>

        <button onclick="guardarFeedback(${i})" class="w-full text-sm font-medium bg-espresso text-paper rounded-md py-2 mt-2.5 tracking-wide">Guardar feedback</button>
        <p id="fb-status-${i}" class="text-sm text-center mt-1.5"></p>
      </div>
    </div>
  </div>`;
}

function toggleDetail(i) {
  const el = document.getElementById('detail-' + i);
  el.classList.toggle('hidden');
}

const FEEDBACK_TOKEN = 'CoffeBuyerBeto';

async function guardarFeedback(i) {
  const c = filtradosActuales[i];
  const statusEl = document.getElementById('fb-status-' + i);
  const boton = document.querySelector(`#detail-${i} button`);

  // Sin selector de formato todavía: no se afirma qué variante compró o
  // probó el usuario. Solo Display_Group_ID viaja siempre; variante/peso
  // quedan vacíos hasta que exista una forma explícita de indicarlos.
  const body = {
    token: FEEDBACK_TOKEN,
    displayGroupId: c.displayGroupId,
    variantId: '',
    sensoryId: '',
    pesoG: '',
    tienda: c.tienda, cafe: c.cafe, urlHistorica: c.urlCompra,
    estadoCompra: val('fb-estado-' + i),
    repetiria: val('fb-repetiria-' + i),
    comentario: val('fb-comentario-' + i),
    ratingPersonal: val('fb-rating-' + i),
    acidezPercibida: val('fb-acidez-' + i),
    dulzorPercibido: val('fb-dulzor-' + i),
    cuerpoPercibido: val('fb-cuerpo-' + i),
    amargorPercibido: val('fb-amargor-' + i),
    tostadoPercibido: val('fb-tostado-' + i),
    resultadoEspresso: val('fb-espresso-' + i),
    resultadoConLeche: val('fb-leche-' + i)
  };

  boton.disabled = true;
  statusEl.innerText = 'Guardando…';
  statusEl.className = 'text-sm text-center mt-1.5 text-inkmuted';

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    statusEl.innerText = data.nueva ? '✓ Guardado' : '✓ Actualizado';
    statusEl.className = 'text-sm text-center mt-1.5 text-moss';
    statusEl.innerText += ' — se reflejará en la tarjeta cuando el motor vuelva a correr';
  } catch (err) {
    statusEl.innerText = 'No se pudo guardar: ' + err.message;
    statusEl.className = 'text-sm text-center mt-1.5 text-clay';
  } finally {
    boton.disabled = false;
  }
}

function val(id) {
  const el = document.getElementById(id);
  return el ? el.value : '';
}

async function cargarSalud() {
  const banner = document.getElementById('healthBanner');
  try {
    const res = await fetch(API_URL + '?action=salud');
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    const r = data.resumen;
    const apto = r.estadoGeneral === 'APTO PARA INTERFAZ';
    banner.className = 'rounded-lg px-3 py-2 mb-3 flex items-center gap-2 text-sm font-mono border ' +
      (apto ? 'border-mossbg bg-mossbg text-moss' : 'border-claybg bg-claybg text-clay');
    banner.innerHTML = `
      <span>${apto ? '✓' : '⚠'} ${r.estadoGeneral}</span>
      <span class="opacity-70 ml-auto">Act. ${r.actualizado}</span>`;
  } catch (err) {
    banner.className = 'rounded-lg px-3 py-2 mb-3 text-sm font-mono border border-line bg-surface text-inkmuted';
    banner.innerText = 'No se pudo verificar el estado del sistema';
  }
}

let tiendasPorNombre = {};

async function cargarTiendas() {
  try {
    const res = await fetch(API_URL + '?action=tiendas');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    data.items.forEach(t => { if (t.tienda) tiendasPorNombre[t.tienda.trim()] = t; });
  } catch (err) {
    // Si falla, el detalle simplemente no muestra dirección — no bloquea el resto de la app.
  }
}

async function cargarRecomendaciones() {
  const loading = document.getElementById('loadingState');
  const errorEl = document.getElementById('errorState');
  const list = document.getElementById('list');

  try {
    const res = await fetch(API_URL + '?action=recomendaciones');
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    loading.classList.add('hidden');
    todosLosCafes = data.items;
    initFiltros(todosLosCafes);
    document.getElementById('filtros').classList.remove('hidden');
    aplicarFiltros();
  } catch (err) {
    loading.classList.add('hidden');
    errorEl.classList.remove('hidden');
    errorEl.innerText = 'No se pudo cargar el listado. Revisá tu conexión o volvé a intentar. (' + err.message + ')';
  }
}

// ============================================================
// FILTROS
// ============================================================

let todosLosCafes = [];
let filtradosActuales = [];
const filtroState = { origenes: new Set(), procesos: new Set(), tiendas: new Set(), soloOfertas: false, precioMin: null, precioMax: null };

function tokensUnicos(items, field) {
  const set = new Set();
  items.forEach(it => {
    String(it[field] || '').split(',').map(s => s.trim()).filter(Boolean).forEach(t => set.add(t));
  });
  return [...set].sort((a, b) => a.localeCompare(b, 'es'));
}

function renderOpciones(containerId, tokens, selectedSet, onChange) {
  const cont = document.getElementById(containerId);
  cont.innerHTML = tokens.map(t => `
    <label class="flex items-center gap-2 text-base px-1 py-1 text-ink">
      <input type="checkbox" value="${t}" class="rounded accent-espresso"> ${t}
    </label>`).join('');
  cont.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      if (cb.checked) selectedSet.add(cb.value); else selectedSet.delete(cb.value);
      onChange();
    });
  });
}

function initFiltros(items) {
  const origenes = tokensUnicos(items, 'origen');
  const procesos = tokensUnicos(items, 'proceso');
  const tiendas = tokensUnicos(items, 'tienda');
  renderOpciones('origenOpciones', origenes, filtroState.origenes, aplicarFiltros);
  renderOpciones('procesoOpciones', procesos, filtroState.procesos, aplicarFiltros);
  renderOpciones('tiendaOpciones', tiendas, filtroState.tiendas, aplicarFiltros);

  document.getElementById('tiendaBuscar').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('#tiendaOpciones label').forEach(l => {
      l.style.display = l.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });

  document.getElementById('origenBuscar').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('#origenOpciones label').forEach(l => {
      l.style.display = l.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });

  const precios = items.map(c => parseNum(c.precioKgMostrado)).filter(v => v !== null);
  const min = precios.length ? Math.floor(Math.min(...precios) / 1000) * 1000 : 0;
  const max = precios.length ? Math.ceil(Math.max(...precios) / 1000) * 1000 : 100000;
  const precioMin = document.getElementById('precioMin');
  const precioMax = document.getElementById('precioMax');
  [precioMin, precioMax].forEach(el => { el.min = min; el.max = max; el.step = 1000; });
  precioMin.value = min;
  precioMax.value = max;
  filtroState.precioMin = min;
  filtroState.precioMax = max;

  function onPrecioChange() {
    let mn = parseInt(precioMin.value), mx = parseInt(precioMax.value);
    if (mn > mx) { [mn, mx] = [mx, mn]; }
    filtroState.precioMin = mn;
    filtroState.precioMax = mx;
    document.getElementById('precioLabel').innerText =
      '$' + new Intl.NumberFormat('es-CL').format(mn) + ' – $' + new Intl.NumberFormat('es-CL').format(mx);
    aplicarFiltros();
  }
  precioMin.addEventListener('input', onPrecioChange);
  precioMax.addEventListener('input', onPrecioChange);
  onPrecioChange();

  document.getElementById('limpiarFiltros').addEventListener('click', () => {
    filtroState.origenes.clear();
    filtroState.procesos.clear();
    filtroState.tiendas.clear();
    filtroState.soloOfertas = false;
    document.getElementById('toggleOfertas').className = 'w-full mt-2 text-sm font-medium py-2 rounded-lg border border-line bg-paper text-inkmuted';
    document.querySelectorAll('#filtros input[type=checkbox]').forEach(cb => cb.checked = false);
    precioMin.value = min; precioMax.value = max;
    onPrecioChange();
  });
}

function toggleSoloOfertas() {
  filtroState.soloOfertas = !filtroState.soloOfertas;
  const btn = document.getElementById('toggleOfertas');
  btn.className = 'w-full mt-2 text-sm font-medium py-2 rounded-lg border border-line ' +
    (filtroState.soloOfertas ? 'bg-claybg text-clay' : 'bg-paper text-inkmuted');
  aplicarFiltros();
}

function contieneAlguno(valorCampo, seleccionados) {
  if (seleccionados.size === 0) return true;
  const texto = String(valorCampo || '').toLowerCase();
  return [...seleccionados].some(sel => texto.includes(sel.toLowerCase()));
}

function aplicarFiltros() {
  const { origenes, procesos, tiendas, soloOfertas, precioMin, precioMax } = filtroState;

  const filtrados = todosLosCafes.filter(c => {
    if (!contieneAlguno(c.origen, origenes)) return false;
    if (!contieneAlguno(c.proceso, procesos)) return false;
    if (!contieneAlguno(c.tienda, tiendas)) return false;
    if (soloOfertas && !c.mejorAlerta) return false;
    const precio = parseNum(c.precioKgMostrado);
    if (precio !== null && (precio < precioMin || precio > precioMax)) return false;
    return true;
  });

  filtradosActuales = filtrados;

  document.getElementById('origenLabel').innerText = origenes.size ? `Origen (${origenes.size})` : 'Origen';
  document.getElementById('procesoLabel').innerText = procesos.size ? `Proceso (${procesos.size})` : 'Proceso';
  document.getElementById('tiendaLabel').innerText = tiendas.size ? `Tienda (${tiendas.size})` : 'Tienda';
  document.getElementById('resultCount').innerText = `${filtrados.length} de ${todosLosCafes.length} cafés`;

  document.getElementById('list').innerHTML = filtrados.length
    ? filtrados.map((c, i) => cardHtml(c, i)).join('')
    : '<p class="text-center text-base text-inkmuted py-10 font-mono">Sin resultados con estos filtros.</p>';
}

function cambiarVista(vista) {
  const esCafes = vista === 'cafes';
  document.getElementById('viewCafes').classList.toggle('hidden', !esCafes);
  document.getElementById('viewTiendas').classList.toggle('hidden', esCafes);
  document.getElementById('tabCafes').className = 'flex-1 text-sm font-medium py-2 rounded-lg border border-line ' + (esCafes ? 'bg-espresso text-paper' : 'bg-surface text-inkmuted');
  document.getElementById('tabTiendas').className = 'flex-1 text-sm font-medium py-2 rounded-lg border border-line ' + (!esCafes ? 'bg-espresso text-paper' : 'bg-surface text-inkmuted');
}

function renderTiendas() {
  const todas = Object.values(tiendasPorNombre);
  const fisicas = todas
    .filter(t => t.tipoTienda && t.tipoTienda.toLowerCase() !== 'virtual')
    .sort((a, b) => (a.comuna || '').localeCompare(b.comuna || '', 'es') || a.tienda.localeCompare(b.tienda, 'es'));
  const virtuales = todas
    .filter(t => !t.tipoTienda || t.tipoTienda.toLowerCase() === 'virtual')
    .sort((a, b) => a.tienda.localeCompare(b.tienda, 'es'));

  document.getElementById('tiendasFisicas').innerHTML =
    `<p class="text-sm font-mono text-inkmuted uppercase tracking-wide mb-2">Físicas</p>` +
    (fisicas.length ? fisicas.map(t => `
      <div class="bg-surface border border-line rounded-xl p-3.5">
        <p class="font-display font-semibold text-lg text-ink">${t.tienda}</p>
        <p class="text-sm text-inkmuted mt-0.5">${[t.direccion, t.comuna].filter(Boolean).join(', ') || 'Sin dirección registrada'}</p>
        ${t.notasUbicacion ? `<p class="text-sm text-inkmuted mt-1">${t.notasUbicacion}</p>` : ''}
      </div>`).join('')
      : `<p class="text-sm text-inkmuted">No hay tiendas físicas registradas.</p>`);

  document.getElementById('tiendasVirtuales').innerHTML =
    `<p class="text-sm font-mono text-inkmuted uppercase tracking-wide mb-2">Virtuales</p>
     <div class="bg-surface border border-line rounded-xl p-3.5 flex flex-wrap gap-2">
       ${virtuales.map(t => `<span class="text-sm px-2.5 py-1 rounded-md bg-paper border border-line text-ink">🌐 ${t.tienda}</span>`).join('')}
     </div>`;
}

async function init() {
  cargarSalud(); // no bloquea el resto, es independiente
  await cargarTiendas();
  renderTiendas();
  await cargarRecomendaciones();
}
init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {
      // Si falla el registro, la app sigue funcionando normal, solo sin caché offline.
    });
  });
}
</script>
